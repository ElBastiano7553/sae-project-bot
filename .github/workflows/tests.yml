# Lance les tests automatiquement à chaque push et à chaque pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    # Vérifie que l'image se construit, tourne sans root et ne contient aucun .env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sae-project-bot:ci .
      - run: test "$(docker run --rm sae-project-bot:ci id -u)" != "0"
      - run: docker run --rm sae-project-bot:ci sh -c 'test ! -e /app/.env'
      - run: docker run --rm --read-only sae-project-bot:ci python -c "import src.main, src.discord_bot.bot"
      # Sans configuration, le bot doit s'arrêter avec un message clair (code 2).
      - run: |
          set +e
          docker run --rm --read-only sae-project-bot:ci
          code=$?
          echo "code de sortie : $code"
          test "$code" -eq 2
