# =====================================================================
#  Structure cible du serveur Discord de l'équipe (lue par /setup et /refonte).
#
#  Chaque salon a une clé (entre crochets) : c'est sa *fonction* pour Samae
#  (messages permanents, notifications GitLab, comptes rendus…). Samae retrouve
#  un salon dans cet ordre :
#    1. l'identifiant Discord déjà enregistré (un salon renommé reste reconnu) ;
#    2. le nom « name », puis les anciens noms « aliases ».
#  Les emojis, accents, majuscules et séparateurs sont ignorés lors de la
#  comparaison : "📢・annonces" et "annonces" désignent le même salon.
#
#  /setup ne crée, ne renomme et ne supprime rien.
#  /refonte peut, après aperçu et confirmation : créer les catégories et salons
#  manquants, renommer ceux qui portent un ancien nom (« aliases ») et les
#  déplacer dans leur catégorie. Elle ne supprime jamais rien.
#
#  optional = true : salon facultatif, créé seulement avec /refonte facultatifs:True
#  (un salon facultatif qui existe déjà est réutilisé, renommé ou déplacé normalement).
#  private = true (catégorie) : créée visible seulement par le bot et les administrateurs.
#
#  Les catégories et salons absents de ce fichier ne sont jamais modifiés.
#  L'ordre des catégories ci-dessous est l'ordre d'affichage souhaité.
# =====================================================================

[categories.accueil]
name = "ACCUEIL"
aliases = ["01 · ACCUEIL & ORGANISATION"]

[categories.commun]
name = "ESPACE COMMUN"

[categories.conception]
name = "CONCEPTION DU JEU"
aliases = ["02 · CONCEPTION DU JEU"]

[categories.organisation]
name = "ORGANISATION"

[categories.developpement]
name = "DÉVELOPPEMENT"
aliases = ["03 · DÉVELOPPEMENT"]

[categories.livrables]
name = "LIVRABLES SAE"
aliases = ["05 · LIVRABLES SAE"]

[categories.vocal]
name = "VOCAL"
aliases = ["06 · VOCAL"]

[categories.administration]
name = "ADMINISTRATION"
private = true

