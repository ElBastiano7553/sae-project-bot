# =====================================================================
#  Rôles de projet (cumulables). /refonte ne les crée que si l'option
#  roles:True est choisie, SANS AUCUNE PERMISSION : ils servent à identifier
#  qui fait quoi, pas à donner des droits. Un rôle qui existe déjà (même nom)
#  n'est jamais modifié. Les droits d'administration de Samae restent ceux de
#  « Gérer le serveur » ou du rôle ADMIN_ROLE_NAME (.env).
# =====================================================================

[roles.responsable]
name = "Responsable projet"
description = "Coordonne l'équipe et anime les réunions (aucun droit Discord supplémentaire)."

[roles.game_design]
name = "Game Design"
description = "Conception du gameplay, des règles et des niveaux."

[roles.developpement]
name = "Développement"
description = "Code du jeu, outils et intégration."

[roles.art]
name = "Art & Design"
description = "Graphismes, interface, sons et références visuelles."

[roles.testeur]
name = "Testeur"
description = "Tests des builds et signalement des bugs."
