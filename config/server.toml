# =====================================================================
#  Structure cible du serveur Discord (lue par /admin installer et /refonte).
#
#  Ce fichier décrit le serveur COMPLET tel qu'il doit être : catégories,
#  salons, rôles, couleurs, permissions, ordre d'affichage. /refonte compare
#  le serveur réel à cette cible et propose, pour chaque élément existant, une
#  action explicite (conserver, renommer, déplacer, corriger les permissions,
#  réordonner, signaler) avant de créer ce qui manque.
#
#  Clés (entre crochets) : la *fonction* de l'élément pour Samae (messages
#  permanents, notifications, comptes rendus…). Ne changez pas une clé : Samae
#  retrouve les salons par identifiant enregistré, puis par nom, puis par
#  anciens noms (« aliases »). Les emojis, accents, majuscules et séparateurs
#  sont ignorés lors de la comparaison : « 📢・annonces » = « annonces ».
#
#  /admin installer ne crée, ne renomme et ne supprime rien.
#  /refonte ne supprime jamais rien sans le mode suppressions:True ET une
#  confirmation séparée ; un élément absent de ce fichier est conservé.
#
#  L'ordre des catégories, des salons et des rôles dans ce fichier est l'ordre
#  d'affichage (rôles : du plus haut au plus bas dans la hiérarchie).
# =====================================================================

# --- Comportement de /refonte ------------------------------------------
[refonte]
profile = "projet"          # profil par défaut (voir [profiles])
style = "projet"            # style par défaut (voir [styles])
permissions = true          # corriger les permissions des catégories et salons reconnus
positions = true            # ordonner catégories, salons et rôles comme dans ce fichier
edit_roles = true           # compléter les rôles existants (couleur, permissions manquantes ; jamais de retrait)
deletions_allowed = true    # autoriser /refonte lancer suppressions:True (toujours sur confirmation séparée)
# Éléments personnalisés à garder tels quels (noms de salons, catégories ou rôles) :
keep = []
# Éléments déclarés obsolètes : leur suppression est PROPOSÉE (jamais automatique).
obsolete = []

# --- Profils de serveur --------------------------------------------------
# Un élément sans « profiles » fait partie de tous les profils.
[profiles.projet]
label = "Projet d'équipe"
description = "Équipe projet SAE : conception, organisation, développement, livrables."
style = "projet"

[profiles.communautaire]
label = "Communauté"
description = "Serveur ouvert : présentations, médias, suggestions, modération."
style = "communautaire"

# --- Styles d'affichage ---------------------------------------------------
# {emoji} et {nom} ; un élément sans emoji garde seulement son nom.
[styles.projet]
label = "Projet d'équipe"
category = "{emoji} {nom}"
channel = "{emoji}・{nom}"
voice = "{emoji} {nom}"

[styles.sobre]
label = "Sobre (sans emoji)"
category = "{nom}"
channel = "{nom}"
voice = "{nom}"

[styles.professionnel]
label = "Professionnel (emojis sur les catégories)"
category = "{emoji} {nom}"
channel = "{nom}"
voice = "{nom}"

[styles.communautaire]
label = "Communautaire"
category = "{emoji} {nom}"
channel = "{emoji}│{nom}"
voice = "{emoji} {nom}"

[styles.gaming]
label = "Gaming"
category = "{emoji} ┃ {nom}"
channel = "{emoji}┃{nom}"
voice = "{emoji}┃{nom}"

# --- Niveaux d'accès (permissions) -----------------------------------------
# Cibles : @everyone, @bot (Samae), @admin (rôle ADMIN_ROLE_NAME du .env),
# role:<clé d'un rôle ci-dessous>. Seules ces cibles sont modifiées : les
# permissions posées pour d'autres rôles ou membres sont conservées.
# Les propriétaires et administrateurs Discord gardent toujours tout l'accès.
[access.public]
label = "Public"
# Public : aucune surcharge. Samae utilise ses permissions de serveur.
[access.public.rules."@everyone"]

[access.lecture]
label = "Lecture seule (le staff publie)"
[access.lecture.rules."@everyone"]
deny = ["send_messages", "create_public_threads", "create_private_threads"]
[access.lecture.rules."@bot"]
allow = ["view_channel", "send_messages", "embed_links", "read_message_history"]
[access.lecture.rules."role:responsable"]
allow = ["send_messages"]
[access.lecture.rules."role:moderateur"]
allow = ["send_messages"]

[access.vote]
label = "Votes (réactions seulement)"
[access.vote.rules."@everyone"]
allow = ["add_reactions"]
deny = ["send_messages", "create_public_threads"]
[access.vote.rules."@bot"]
allow = ["view_channel", "send_messages", "embed_links", "read_message_history", "add_reactions"]
[access.vote.rules."role:responsable"]
allow = ["send_messages"]

[access.staff]
label = "Staff seulement"
[access.staff.rules."@everyone"]
deny = ["view_channel"]
[access.staff.rules."@bot"]
allow = ["view_channel", "send_messages", "embed_links", "read_message_history"]
[access.staff.rules."@admin"]
allow = ["view_channel", "send_messages", "read_message_history"]
[access.staff.rules."role:responsable"]
allow = ["view_channel", "send_messages", "read_message_history"]
[access.staff.rules."role:moderateur"]
allow = ["view_channel", "send_messages", "read_message_history"]

