# =====================================================================
#  Rôles, du plus haut au plus bas dans la hiérarchie.
#
#  self_assignable = true : le rôle est proposé dans le choix des rôles
#  (bouton « Choisir mes rôles », /roles). Permis seulement pour kind =
#  "fonction" ou "notification" sans permission ; Samae refuse en plus, au
#  moment du choix, tout rôle qui porterait une permission sensible.
#
#  Samae ne donne JAMAIS la permission Administrateur. Les permissions de
#  modération ne sont possibles que pour kind = "staff". Un rôle existant
#  (même nom ou ancien nom) est réutilisé : jamais de doublon, jamais de
#  permission retirée. Samae ne peut gérer que les rôles placés sous son
#  propre rôle, et seulement avec des permissions qu'il possède.
#  Les droits d'administration de Samae restent « Gérer le serveur » ou le
#  rôle ADMIN_ROLE_NAME (.env).
# =====================================================================

[roles.responsable]
name = "Responsable projet"
color = "#C9A227"
kind = "staff"
hoist = true
permissions = ["manage_messages", "manage_threads", "manage_events", "pin_messages"]
description = "Coordonne l'équipe, publie les annonces et les décisions."
aliases = ["Responsable"]

[roles.moderateur]
name = "Modérateur"
color = "#5FA37A"
kind = "staff"
hoist = true
permissions = ["manage_messages", "manage_threads", "moderate_members", "mute_members", "move_members"]
description = "Fait respecter le règlement."
profiles = ["communautaire"]
aliases = ["Modo", "Moderateur"]

